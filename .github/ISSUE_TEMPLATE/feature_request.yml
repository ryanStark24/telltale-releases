name: Feature request
description: Suggest something Telltale should do.
title: "Feature idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. This issue is public, so please don't include org names, customer data or anything private.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What gets in your way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What is your idea?
      description: How do you imagine it working?
    validations:
      required: true
  - type: textarea
    id: usage
    attributes:
      label: How would you use it?
      description: When would it come up in your work?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Telltale version
      description: Shown in Settings › About.
      placeholder: "Shown in Settings › About"
