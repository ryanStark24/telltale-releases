# Cloudflare Pages project config, kept at the ROOT of the telltale-releases repo (next to docs/ and functions/).
# With pages_build_output_dir set, Cloudflare reads bindings from this file.
name = "telltale-releases"
pages_build_output_dir = "docs"
compatibility_date = "2026-01-01"

# Per-IP limit store for /api/feedback. Create with: wrangler kv namespace create RATE, then paste the id.
[[kv_namespaces]]
binding = "RATE"
id = "6634e2c074e8474f806a305e4472d9e6"

# Download counts by country (Workers Analytics Engine). The dataset is created on first write.
[[analytics_engine_datasets]]
binding = "HITS"
dataset = "telltale_hits"

# Plain variable, not a secret: the owner's Cloudflare account id, used by /api/stats to query Analytics Engine.
[vars]
CF_ACCOUNT_ID = "f6d88acf223c4d4995b9ea145fa01ff0"

# Secrets (set in the dashboard, never in this file): TURNSTILE_SECRET, GITHUB_TOKEN,
# CF_API_TOKEN (API token with Account > Account Analytics > Read, for /api/stats)
